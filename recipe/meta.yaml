{% set name = "hdxms-datasets" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hdxms_datasets-{{ version }}.tar.gz
  sha256: c0000a78ef19f0c4fd04a8e610147363e6624eff152b0e8db2c4bb0d47b0d686

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - pandas
    - pyyaml
    - requests
    - packaging

test:
  imports:
    - hdxms_datasets
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Download and parse curated HDX-MS datasets
  home: https://github.com/Jhsmit/hdxms-datasets/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Jhsmit
