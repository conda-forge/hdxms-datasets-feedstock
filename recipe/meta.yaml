{% set name = "hdxms-datasets" %}
{% set version = "0.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hdxms_datasets-{{ version }}.tar.gz
  sha256: d5b0dfa9c79615e8ef06a3e9567530d6978f13b9bc73be8cb76d98970e014440

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - pandas
    - pyyaml
    - requests
    - packaging

test:
  imports:
    - hdxms_datasets
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Download and parse curated HDX-MS datasets
  home: https://github.com/Jhsmit/hdxms-datasets/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Jhsmit
